<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-label="Esteira — correnteza abissal">
      <defs>
        <radialGradient id="es-bg" cx="0.15" cy="0.5" r="1"><stop offset="0" stop-color="#04162a"/><stop offset="1" stop-color="#01060f"/></radialGradient>
        <radialGradient id="es-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4d7cff" stop-opacity=".5"/><stop offset="1" stop-color="#4d7cff" stop-opacity="0"/></radialGradient>
        <clipPath id="pnl-es"><rect width="1280" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#pnl-es)">
      <rect width="1280" height="300" fill="url(#es-bg)"/>
      <g fill="none" stroke="#4d7cff" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-opacity=".13" stroke-width="2"><path d="M690 30 H1040"/><path d="M1176 66 V236"/><path d="M994 30 V96"/></g>
        <g stroke-opacity=".4"><circle cx="690" cy="30" r="4" fill="#4d7cff" fill-opacity=".3"/><rect x="986" y="88" width="16" height="16" rx="2" fill="#4d7cff" fill-opacity=".22"/><path d="M1176 236 v22 m-6 -9 l6 13 6 -13"/></g>
        <g stroke="#cfdaff" stroke-width="2.4" stroke-opacity=".9" stroke-dasharray="9 620">
          <path d="M690 30 H1040"><animate attributeName="stroke-dashoffset" values="629;0" dur="3.8s" begin="-0.7s" repeatCount="indefinite"/></path>
          <path d="M1176 66 V236"><animate attributeName="stroke-dashoffset" values="629;0" dur="3.2s" begin="-2s" repeatCount="indefinite"/></path>
        </g>
      </g>
      <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#4d7cff">
        <text x="540" opacity=".15">1<tspan x="540" dy="17">0</tspan><tspan x="540" dy="17">1</tspan><animateTransform attributeName="transform" type="translate" values="0,-60;0,320" dur="8s" begin="-3s" repeatCount="indefinite"/></text>
        <text x="820" opacity=".12">01<tspan x="820" dy="17">0</tspan><tspan x="820" dy="17">1</tspan><animateTransform attributeName="transform" type="translate" values="0,-80;0,320" dur="6.5s" repeatCount="indefinite"/></text>
        <text x="1020" opacity=".13">0<tspan x="1020" dy="17">1</tspan><tspan x="1020" dy="17">1</tspan><animateTransform attributeName="transform" type="translate" values="0,-40;0,320" dur="9s" begin="-2s" repeatCount="indefinite"/></text>
      </g>
      <!-- current streamlines across the whole banner -->
      <g stroke="#4d7cff" fill="none" stroke-opacity=".18">
        <path d="M60 96 C 360 60, 900 140, 1240 96"/><path d="M60 150 C 360 118, 900 190, 1240 150"/><path d="M60 206 C 360 176, 900 250, 1240 206"/>
      </g>
      <!-- glowing packets carried by the current -->
      <g fill="#7fa6ff">
        <rect x="0" y="140" width="18" height="18" rx="4" opacity=".9"><animateMotion path="M60 150 C 360 118, 900 190, 1240 150" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="0" y="86" width="14" height="14" rx="3" opacity=".8"><animateMotion path="M60 96 C 360 60, 900 140, 1240 96" dur="6.5s" begin="-2s" repeatCount="indefinite"/></rect>
        <rect x="0" y="196" width="16" height="16" rx="3" opacity=".8"><animateMotion path="M60 206 C 360 176, 900 250, 1240 206" dur="7s" begin="-3s" repeatCount="indefinite"/></rect>
        <circle cx="0" cy="150" r="4"><animateMotion path="M60 150 C 360 118, 900 190, 1240 150" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
      </g>
      <g transform="translate(190,150)">
        <circle r="120" fill="url(#es-glow)"><animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/></circle>
        <!-- gear-node = the pipeline heart -->
        <g fill="none" stroke="#7fa6ff" stroke-width="3">
          <circle r="30"/><circle r="12" fill="#02132a"/>
          <g stroke-width="7"><path d="M0 -44V-30M0 30V44M-44 0H-30M44 0H30M-31 -31l10 10M31 31l-10 -10M-31 31l10 -10M31 -31l-10 10"/></g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        </g>
      </g>
      <text x="410" y="118" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="5" fill="#89a9ff" opacity=".9">SEGURANÇA DE PIPELINES · GITHUB ACTIONS</text>
      <text x="408" y="192" font-family="Segoe UI,system-ui,sans-serif" font-weight="800" font-size="78" letter-spacing="-1" fill="#eaf1ff">Esteira</text>
      <text x="412" y="232" font-family="Segoe UI,system-ui,sans-serif" font-size="21" fill="#a7bdf0">O ataque moderno entra pela correnteza. Ela vigia o fluxo.</text>
      <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#9db2e6">
        <rect x="412" y="250" width="126" height="26" rx="13" fill="none" stroke="#4d7cff" stroke-opacity=".4"/><text x="426" y="267">script-injection</text>
        <rect x="546" y="250" width="116" height="26" rx="13" fill="none" stroke="#4d7cff" stroke-opacity=".4"/><text x="560" y="267">SHA-pinning</text>
        <rect x="670" y="250" width="104" height="26" rx="13" fill="none" stroke="#4d7cff" stroke-opacity=".4"/><text x="684" y="267">pr-target</text>
      </g>
      <g transform="translate(1092,44)"><rect width="150" height="34" rx="17" fill="#04172c" stroke="#f5c451" stroke-opacity=".55"/><path d="M22 17a5 5 0 0 1 10 0v4M20 21h14v11H20z" fill="none" stroke="#f5c451" stroke-width="1.5"/><text x="44" y="23" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#f3d488">PRO · privado</text></g>
      </g>
  <rect x=".5" y=".5" width="1279" height="299" rx="15.5" fill="none" stroke="#4d7cff" stroke-opacity=".42" stroke-width="1"/>
</svg>
