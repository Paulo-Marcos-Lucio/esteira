name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # actions fixadas por SHA — o Esteira dá o exemplo do que ele exige.
      # persist-credentials: false — o checkout não precisa deixar o token no .git/config
      # deste job, e é a mitigação que a checagem 'checkout-credentials-in-artifact' pede.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy src
      # cobertura e limiar vêm do pyproject.toml: CI e máquina do dev rodam o mesmo comando.
      - name: Pytest
        run: pytest

  self-scan:
    name: Esteira audita o próprio CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install .
      # --fail-on low, não high: com 'high' os achados que a própria ferramenta classifica
      # como LOW (uma action por tag, por exemplo) ficariam invisíveis, e o portão só vale
      # se fechar no nível em que o Esteira reclama.
      - name: Auditoria (o próprio pipeline deve passar)
        run: esteira scan . --fail-on low -f sarif -o esteira.sarif
      - name: Publica SARIF no Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: esteira.sarif
