[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esteira"
version = "0.5.0"
description = "Auditor de segurança de pipelines CI/CD (GitHub Actions) — script injection, actions não-fixadas por SHA, pull_request_target perigoso e permissões excessivas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paulo Marcos Lucio" }]
keywords = ["security", "ci-cd", "github-actions", "devsecops", "supply-chain", "appsec", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.27",
  "rich>=15.0.0",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
# Pisos elevados para as versões efetivamente instaladas e testadas neste repo (portões
# verdes). Piso não é aspiração: é o mínimo em que a suíte foi validada — abaixo dele o
# comportamento não foi verificado. Isso também torna redundantes os PRs do Dependabot que
# só pediam para subir esses mesmos pisos.
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.1",
  "mypy>=2.3.0",
  "hypothesis>=6.165.0",
  "types-PyYAML>=6.0.12.20260724",
]

[project.urls]
Homepage = "https://github.com/Paulo-Marcos-Lucio/esteira"
Repository = "https://github.com/Paulo-Marcos-Lucio/esteira"

[project.scripts]
esteira = "esteira.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esteira"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/esteira/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["typer.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# O comando mora aqui, não no ci.yml: `make`, o dev e o CI passam a rodar exatamente a mesma
# coisa. `--cov-fail-under` é o portão que faltava — sem ele o `--cov` só imprimia um número
# que ninguém lia, e um PR que apagasse 5 dos 7 arquivos de teste derrubava a cobertura de
# 95% para 65% com o CI verde. O limiar é o valor medido arredondado para BAIXO: é trava
# anti-regressão, não aspiração.
addopts = "-q --strict-markers --cov=esteira --cov-report=term-missing --cov-fail-under=93"
